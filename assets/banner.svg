<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" role="img" aria-label="Simar Singh Rayat GitHub Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glowing filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes spinOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .floating { animation: float 4s ease-in-out infinite; }
    .pulse-orb-1 { animation: pulse 6s ease-in-out infinite; transform-origin: 820px 60px; }
    .pulse-orb-2 { animation: pulse 7s ease-in-out infinite 2s; transform-origin: 90px 180px; }
  </style>

  <!-- Card Background with Rounded Edges -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="800" cy="50" r="100" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-orb-1" />
  <circle cx="100" cy="180" r="90" fill="#818cf8" opacity="0.1" filter="url(#glow)" class="pulse-orb-2" />
  <circle cx="500" cy="220" r="120" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Top Accent Terminal Bar -->
  <circle cx="36" cy="32" r="5.5" fill="#f43f5e" opacity="0.85" />
  <circle cx="56" cy="32" r="5.5" fill="#eab308" opacity="0.85" />
  <circle cx="76" cy="32" r="5.5" fill="#10b981" opacity="0.85" />
  <text x="105" y="36" fill="#64748b" font-family="'Fira Code', 'Courier New', monospace" font-size="12" letter-spacing="1">SIMAR_SINGH_RAYAT // RESEARCH &amp; SYSTEMS</text>

  <!-- Status Badge Pill in Top Right -->
  <rect x="670" y="22" width="195" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="686" cy="35" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="698" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN FOR RESEARCH</text>

  <!-- Main Hero Title -->
  <text x="50" y="105" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">SIMAR SINGH RAYAT</text>

  <!-- Subtitle Tagline -->
  <text x="52" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
    AI &amp; ML Researcher <tspan fill="#38bdf8">|</tspan> Cyber-Physical Systems <tspan fill="#38bdf8">|</tspan> Open Source Systems Engineer
  </text>

  <!-- Metric Badges Row -->
  <!-- Box 1 -->
  <g transform="translate(52, 168)">
    <rect width="170" height="42" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="26" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="15" font-weight="700">31+ </text>
    <text x="52" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Publications</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(236, 168)">
    <rect width="180" height="42" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="26" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="15" font-weight="700">13 </text>
    <text x="44" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Patents &amp; Designs</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(430, 168)">
    <rect width="195" height="42" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="26" fill="#34d399" font-family="'Fira Code', monospace" font-size="15" font-weight="700">10+ </text>
    <text x="48" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">MS Apps (1k+ Users)</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(639, 168)">
    <rect width="205" height="42" rx="8" fill="#131c31" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="26" fill="#f472b6" font-family="'Fira Code', monospace" font-size="15" font-weight="700">Best Paper </text>
    <text x="100" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">ComSIA '26</text>
  </g>

</svg>
